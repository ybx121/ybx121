name: Generate contribution snake

on:
  # Run automatically every day at 00:17 UTC+8.
  # Avoid running exactly at the start of an hour,
  # because GitHub Actions has higher load at that time.
  schedule:
    - cron: "17 0 * * *"
      timezone: "Asia/Shanghai"

  # Allow manual runs from the Actions page.
  workflow_dispatch:

  # Run whenever the main branch is updated.
  push:
    branches:
      - main

# Prevent multiple snake-generation jobs from running at the same time.
concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Required for publishing generated files to the output branch.
    permissions:
      contents: write

    steps:
      # Generate light and dark SVG versions of the contribution snake.
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Publish the generated SVG files to the output branch.
      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          # force_orphan: true
